name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-godot
        with:
          android: "true"

      - name: Set version
        run: |
          v=$(tr -d '[:space:]' < version.txt)
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::Tag v$v existiert bereits."; exit 1
          fi
          # Version code must always grow: number of commits on main.
          code=$(git rev-list --count HEAD)
          sed -i "s|^version/code=.*|version/code=$code|; s|^version/name=.*|version/name=\"$v\"|" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          apk="frontline-forge-$VERSION.apk"
          mkdir -p build
          godot --headless --path . --export-release "Android" "build/$apk"
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          test -s "build/$apk"
          cd build && sha256sum "$apk" > "$apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/*.apk build/*.sha256 \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
